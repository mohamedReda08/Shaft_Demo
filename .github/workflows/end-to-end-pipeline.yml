name: e2e pipeline
run-name: Build, Deploy, Test - from user@${{github.actor}}

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.3

      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: temuin
          cache: maven

      - name: Run Unit Test
        run: mvn-test
 
analyze:
  name: analyze
  runs-on: ubunto-latest
  permissions: 
    actions: read
    contents: read
    security-events: write

  strategy: 
    fail-fast: false
    matrix:
      language: ["javascript", "java"]

  steps:
    - name: Checkout Repository
      uses: checkout/actions@v3

    - name: Initialize CodeQL
      uses: github/codeql-actions/init@v2
      with:
        languages: ${{matrix.language}}
    
    - name: Autobuild
      uses: github/codeql-actions/autobuild@v2

    - name: Perform CodeQL analysis
      uses: github/codeql-actions/analyze@v2
      with:
        category: "/language: ${{matrix.language}}"
      
    
    
